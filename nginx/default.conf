server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers, so redirects work behind any port or proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    error_page 404 /404.html;

    # Old WordPress query-string links (/?p=123, /index.php?cat=4, ...) ->
    # permanent redirects. The maps are in redirects.conf, generated from
    # url-map.csv by tools/build-redirects.py.
    location ~ ^/(index\.php)?$ {
        if ($old_p)             { return 301 $old_p; }
        if ($old_page_id)       { return 301 $old_page_id; }
        if ($old_attachment_id) { return 301 $old_attachment_id; }
        if ($old_cat)           { return 301 $old_cat; }
        if ($old_category_name) { return 301 $old_category_name; }
        if ($old_tag)           { return 301 $old_tag; }
        if ($old_author)        { return 301 $old_author; }
        if ($old_m)             { return 301 $old_m; }
        if ($old_paged)         { return 301 $old_paged; }
        if ($old_feed)          { return 301 $old_feed; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ @old;
    }

    # Comics, theme images, CSS and JS never change once published.
    location ~* \.(jpe?g|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @old;
    }

    # Anything not found: old paths (initial export, /comic/..., uploads) -> new.
    location @old {
        if ($old_path) { return 301 $old_path; }
        return 404;
    }

    # Lets Kubernetes check that the site is up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

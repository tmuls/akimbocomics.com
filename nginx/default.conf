server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers, so redirects work behind any port or proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Old WordPress query-string links (?p=, ?page_id=, ?cat=) -> permanent redirects.
    location = / {
        if ($old_post) { return 301 $old_post; }
        if ($old_page) { return 301 $old_page; }
        if ($old_cat)  { return 301 $old_cat; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Lets Kubernetes check that the site is up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Comics, theme images, CSS and JS never change once published.
    location ~* \.(jpe?g|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

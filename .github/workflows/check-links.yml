name: Check old links

# The rule for this site: never break an old link. Runs on every push and
# pull request and fails if any URL the site has ever served stops working.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The redirect files must be regenerated and committed whenever
      # url-map.csv or site/ changes.
      - name: Redirects are up to date with url-map.csv
        run: |
          python3 tools/build-redirects.py
          git diff --exit-code -- nginx/redirects.conf site/redirects.js site/404.html site/index.html \
            || { echo "::error::Run python3 tools/build-redirects.py and commit the result"; exit 1; }

      - name: Every known URL is still served or redirected
        run: python3 tools/check-known-urls.py

      # Building the image also builds the site (Stencil, from content/)
      # and fails if any generated page differs from site/ or any known URL
      # is missing from the output (tools/build-site.py).
      - name: Every old URL redirects in the real nginx image
        run: |
          docker build -t akimbocomics-check .
          docker run -d --name site -p 8080:8080 akimbocomics-check
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/healthz && break; sleep 1; done
          python3 tools/check-redirects.py http://localhost:8080

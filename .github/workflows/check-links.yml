name: Check old links

# The rule for this site: never break an old link. Runs on every push and
# pull request and fails if any URL the site has ever served stops working.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/stencil/package-lock.json

      # Builds dist/ (Stencil prerenders every page from site/content/,
      # plus site/static/ and the redirect files) and fails if a page is
      # missing or broken or any known URL is neither served nor redirected.
      - name: Build the site; every known URL is still served or redirected
        run: |
          (cd site/stencil && npm ci --no-audit --no-fund)
          python3 tools/build-site.py

      # nginx/redirects.conf must be regenerated and committed whenever
      # url-map.csv changes.
      - name: Redirects are up to date with url-map.csv
        run: |
          git diff --exit-code -- nginx/redirects.conf \
            || { echo "::error::Run python3 tools/build-site.py (or tools/build-redirects.py) and commit nginx/redirects.conf"; exit 1; }

      # The image builds the site again the same way and serves it.
      - name: Every old URL redirects in the real nginx image
        run: |
          docker build -t akimbocomics-check .
          docker run -d --name site -p 8080:8080 akimbocomics-check
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/healthz && break; sleep 1; done
          python3 tools/check-redirects.py http://localhost:8080

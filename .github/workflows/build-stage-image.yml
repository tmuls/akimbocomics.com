name: Build stage image

# Builds the "stage" branch into ghcr.io/tmuls/akimbocomics.com:stage, the
# preview at stage.akimbocomics.com. Run by hand only: Actions → "Build stage
# image" → Run workflow. It always builds the stage branch, whichever branch
# is picked in that menu (this file just has to be on main to show up there).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage
        uses: actions/checkout@v4
        with:
          ref: stage

      # The preview is a copy of the real site; keep search engines off it.
      - name: Block search engines
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/static/robots.txt

      # Tags: "stage", plus "stage-<short commit>" of the stage branch (not
      # of the branch the run was started from) so you can tell what's up.
      - name: Image tags
        id: tags
        run: |
          image=ghcr.io/${{ github.repository }}
          echo "tags=$image:stage,$image:stage-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # QEMU lets this (amd64) runner build the arm64 version for the Pi.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=stage
          cache-to: type=gha,mode=max,scope=stage
